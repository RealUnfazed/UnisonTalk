# Sample load balancer for docker-compose.scale.yml.
worker_processes auto;
events { worker_connections 1024; }

http {
  # WebSocket upgrade support.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream unisontalk {
    # Sticky by client IP. Socket.IO opens with several HTTP long-polling
    # requests before upgrading to WebSocket, and they must all reach the
    # same instance. (Alternative: make the client WebSocket-only.)
    ip_hash;
    server app:3000;
  }

  server {
    listen 80;
    client_max_body_size 25m;   # uploads are capped at 20 MB

    location / {
      proxy_pass http://unisontalk;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;   # idle WebSockets are kept alive by Socket.IO pings
    }
  }
}
