# Several app instances behind nginx, sharing state through Redis (needs Docker
# Compose v2.24+ for the `!reset` tag below):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build --scale app=2
# Open http://localhost:8080.
#
# Notes:
#  - Redis carries Socket.IO events and the rate-limit counters between instances.
#  - Uploads still sit on one shared volume, so this only works with all
#    instances on ONE host. Spreading across hosts needs object storage (S3),
#    which is the next phase.
#  - nginx resolves the `app` replicas when it starts: start it after the
#    replicas are healthy (depends_on does that) and restart it if you
#    scale up or down.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    ports: !reset []
    environment:
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
